<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Umphrey's McGee guitar tablature archive.">
    <meta name="theme-color" content="#121212">
    <title>Umphrey's McGee Guitar Tabs</title>
    <link rel="icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
  </head>
  <body>
    <div class="container">
      <header class="site-header">
        <h1>Umphrey's McGee Guitar Tabs</h1>
      </header>

      <div class="search-box">
        <input
          id="search"
          type="search"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="Search songs"
          aria-label="Search songs"
        >
      </div>

      <nav id="tabList" class="tab-list" aria-label="Songs"><!-- TAB_LIST_ITEMS --></nav>

      <footer class="site-footer">
        <a href="https://github.com/mattypiper/umtabs">Contribute on GitHub</a>
      </footer>
    </div>
  </body>
</html>
